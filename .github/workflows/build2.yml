name: build

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: 8.5

      - name: Compilar
        run: |
          F=$(find . -name settings.gradle -not -path "./.git/*" | head -n 1)
          if [ -z "$F" ]; then
            echo "settings.gradle nao encontrado no repositorio. Arquivos presentes:"
            ls -R | head -50
            exit 1
          fi
          cd "$(dirname "$F")"
          gradle build --no-daemon

      - name: Guardar o jar
        uses: actions/upload-artifact@v4
        with:
          name: blockexport-jar
          path: |
            **/build/libs/*.jar
            !**/build/libs/*-sources.jar
